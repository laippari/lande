<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8f9bb0">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Käsin piilutettu mäntyhirsi lohenpyrstöpäin: 3D-malli, jossa vuosirenkaat, oksat ja piilukirveen jäljet lasketaan puun todellisesta rakenteesta. WebGPU.">
  <title>Piiluhirsi</title>
  <style>
    :root {
      --fg: #1f1c18;
      --muted: rgba(31, 28, 24, 0.62);
      --glass: rgba(250, 247, 241, 0.72);
      --glass-edge: rgba(255, 255, 255, 0.6);
      --on: rgba(255, 255, 255, 0.9);
      --track: rgba(31, 28, 24, 0.16);
      --accent: #b8742c;
      --shadow: 0 14px 40px rgba(40, 30, 20, 0.22), 0 2px 6px rgba(40, 30, 20, 0.1);
      --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #8f9bb0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font: 400 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
    }
    button { font: inherit; color: inherit; }
    #viewer { position: fixed; inset: 0; touch-action: none; }
    #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px;
      background: linear-gradient(#8f9bb0, #b9b0a2 62%, #9a8d7c);
      color: rgba(255, 255, 255, 0.92); pointer-events: none; transition: opacity 0.7s ease;
    }
    #loading span {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
      animation: spin 0.9s linear infinite;
    }
    #loading p { margin: 0; font-size: 13px; letter-spacing: 0.02em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.ready #loading { opacity: 0; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      backdrop-filter: blur(18px) saturate(1.3);
    }

    #title {
      position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
      padding: 9px 14px 10px; border-radius: 16px; pointer-events: none;
      opacity: 0; transform: translateY(-6px); transition: opacity 0.6s ease 0.2s, transform 0.6s var(--ease) 0.2s;
    }
    body.ready #title { opacity: 1; transform: none; }
    #title h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
    #title p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

    #badge {
      display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 650; letter-spacing: 0.04em; color: var(--muted);
      border: 1px solid var(--track);
    }
    #badge:empty { display: none; }

    #dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 12px max(16px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none;
      opacity: 0; transform: translateY(10px); transition: opacity 0.6s ease 0.3s, transform 0.6s var(--ease) 0.3s;
    }
    body.ready #dock { opacity: 1; transform: none; }
    #hint {
      margin: 0; padding: 5px 12px; border-radius: 999px; font-size: 12px; color: rgba(255, 255, 255, 0.95);
      background: rgba(30, 26, 22, 0.42); transition: opacity 0.8s ease; text-align: center;
    }
    #hint.gone { opacity: 0; }

    #light {
      width: min(360px, 100%); box-sizing: border-box; padding: 12px 16px 14px; border-radius: 20px;
      display: grid; gap: 10px; pointer-events: auto;
      transform-origin: 50% 100%; transition: opacity 0.25s ease, transform 0.3s var(--ease);
    }
    #light[hidden] { display: grid; opacity: 0; transform: translateY(8px) scale(0.97); pointer-events: none; }
    #light label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12px; color: var(--muted); }
    #light output { font-variant-numeric: tabular-nums; color: var(--fg); }
    #light input { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); height: 24px; touch-action: pan-y; }

    #bar { display: flex; gap: 8px; align-items: center; max-width: 100%; pointer-events: auto; }
    #views {
      display: flex; gap: 2px; padding: 4px; border-radius: 999px; overflow-x: auto; scrollbar-width: none;
    }
    #views::-webkit-scrollbar { display: none; }
    #views button, #sun {
      border: 0; background: transparent; cursor: pointer; white-space: nowrap;
      padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 550;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    #views button { color: var(--muted); }
    #views button[aria-pressed="true"] { background: var(--on); color: var(--fg); box-shadow: 0 1px 3px rgba(40, 30, 20, 0.14); }
    #sun {
      flex: none; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-radius: 50%;
      border: 1px solid var(--glass-edge);
    }
    #sun svg { width: 20px; height: 20px; }
    #sun[aria-expanded="true"] { background: var(--on); color: var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #error {
      position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); margin: 0 auto; max-width: 440px;
      padding: 16px 18px; border-radius: 16px; background: rgba(255, 255, 255, 0.94); box-shadow: var(--shadow);
      font-size: 14px; -webkit-user-select: text; user-select: text;
    }
    @media (max-width: 480px) {
      #views button { padding: 9px 11px; font-size: 12.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01s !important; animation-duration: 0.01s !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <div id="loading"><span></span><p>Veistetään hirttä…</p></div>

  <header id="title" class="glass">
    <h1>Piiluhirsi<span id="badge"></span></h1>
    <p>Mänty · 5,0 m · 20 × 30–35 cm · lohenpyrstöpäät</p>
  </header>

  <div id="dock">
    <p id="hint">Vedä · nipistä · kaksoisnapauta tarkentaaksesi</p>
    <div id="light" class="glass" hidden>
      <label>Valon suunta <output id="azOut"></output>
        <input id="az" type="range" min="0" max="360" step="1" aria-label="Valon suunta">
      </label>
      <label>Auringon korkeus <output id="elOut"></output>
        <input id="el" type="range" min="4" max="70" step="1" aria-label="Auringon korkeus">
      </label>
    </div>
    <div id="bar">
      <nav id="views" class="glass" aria-label="Näkymät"></nav>
      <button id="sun" class="glass" type="button" aria-label="Valaistus" aria-expanded="false" aria-controls="light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/>
        </svg>
      </button>
    </div>
  </div>

  <p id="error" hidden></p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
