<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8f9bb0">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Piiluhirsistä veistetty mökki mäntykankaalla järven rannassa: 12 × 8 m, terassi, lasitettu pergola ja palju. WebGPU.">
  <title>Hirsimökki</title>
  <style>
    :root {
      --fg: #1f1c18;
      --muted: rgba(31, 28, 24, 0.62);
      --glass: rgba(250, 247, 241, 0.72);
      --glass-edge: rgba(255, 255, 255, 0.6);
      --on: rgba(255, 255, 255, 0.9);
      --track: rgba(31, 28, 24, 0.16);
      --accent: #b8742c;
      --shadow: 0 14px 40px rgba(40, 30, 20, 0.22), 0 2px 6px rgba(40, 30, 20, 0.1);
      --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #8f9bb0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font: 400 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
    }
    button { font: inherit; color: inherit; }
    #viewer { position: fixed; inset: 0; touch-action: none; }
    #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px;
      background: linear-gradient(#8f9bb0, #b9b0a2 62%, #9a8d7c);
      color: rgba(255, 255, 255, 0.92); pointer-events: none; transition: opacity 0.7s ease;
    }
    #loading span {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
      animation: spin 0.9s linear infinite;
    }
    #loading p { margin: 0; font-size: 13px; letter-spacing: 0.02em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.ready #loading { opacity: 0; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      backdrop-filter: blur(18px) saturate(1.3);
    }

    #title {
      position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
      padding: 9px 14px 10px; border-radius: 16px; pointer-events: none;
      opacity: 0; transform: translateY(-6px); transition: opacity 0.6s ease 0.2s, transform 0.6s var(--ease) 0.2s;
    }
    body.ready #title { opacity: 1; transform: none; }
    #title h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
    #title p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
    #title #meter { margin-top: 4px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
    #title #meter[hidden] { display: none; }

    #badge {
      display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 650; letter-spacing: 0.04em; color: var(--muted);
      border: 1px solid var(--track);
    }
    #badge:empty { display: none; }

    /* --- valikkopainike ja alapaneeli (bottom sheet) --- */
    #hint {
      position: fixed; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px)); transform: translateX(-50%);
      margin: 0; padding: 6px 13px; border-radius: 999px; font-size: 12px; color: rgba(255, 255, 255, 0.95);
      background: rgba(30, 26, 22, 0.42); transition: opacity 0.8s ease; text-align: center; pointer-events: none;
      max-width: calc(100% - 140px); opacity: 0;
    }
    body.ready #hint { opacity: 1; }
    body.ready #hint.gone, body.sheet-open #hint { opacity: 0; }

    #menu {
      position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
      width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
      color: var(--fg); padding: 0; z-index: 3;
      opacity: 0; transform: scale(0.9); transition: opacity 0.5s ease 0.3s, transform 0.5s var(--ease) 0.3s, background-color 0.2s ease;
    }
    body.ready #menu { opacity: 1; transform: none; }
    #menu svg { width: 22px; height: 22px; }
    body.sheet-open #menu { opacity: 0; pointer-events: none; transform: scale(0.85); transition-delay: 0s; }
    #sheetClose {
      position: absolute; top: 25px; right: 12px; width: 36px; height: 36px; border-radius: 50%; padding: 0;
      border: 0; background: var(--track); color: var(--fg); cursor: pointer; display: grid; place-items: center;
    }
    #sheetClose svg { width: 18px; height: 18px; }

    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(480px, 100%); box-sizing: border-box; z-index: 2;
      max-height: min(58vh, 520px); display: flex; flex-direction: column;
      border-radius: 22px 22px 0 0; border-bottom: 0;
      padding: 6px 0 max(14px, env(safe-area-inset-bottom));
      transform: translateY(105%); transition: transform 0.38s var(--ease); visibility: hidden;
    }
    body.sheet-open #sheet { transform: none; visibility: visible; }
    #sheet.dragging { transition: none; }
    .grip { flex: none; height: 22px; display: grid; place-items: center; cursor: grab; touch-action: none; }
    .grip::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--track); }
    .tabs {
      flex: none; display: flex; gap: 2px; margin: 0 16px 10px; padding: 3px; border-radius: 999px; background: var(--track);
      margin-right: 58px; overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button {
      flex: 1; border: 0; background: transparent; cursor: pointer; white-space: nowrap; border-radius: 999px;
      padding: 7px 10px; font-size: 13px; font-weight: 550; color: var(--muted);
    }
    .tabs button[aria-selected="true"] { background: var(--on); color: var(--fg); box-shadow: 0 1px 3px rgba(40, 30, 20, 0.14); }
    .tabpanel { overflow-y: auto; padding: 2px 16px 4px; display: grid; gap: 12px; align-content: start; overscroll-behavior: contain; }
    .tabpanel[hidden] { display: none; }
    .tabpanel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12px; color: var(--muted); }
    .tabpanel label[hidden] { display: none; }
    .tabpanel output { font-variant-numeric: tabular-nums; color: var(--fg); }
    .tabpanel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); height: 26px; touch-action: pan-y; }
    .tabpanel .note { margin: -4px 0 0; font-size: 12px; color: var(--muted); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--track); }
    .seg button, .switch {
      border: 0; background: transparent; cursor: pointer; white-space: nowrap; border-radius: 999px;
      padding: 7px 12px; font-size: 13px; font-weight: 550; color: var(--muted);
    }
    .seg button { flex: 1; }
    .seg button[aria-pressed="true"] { background: var(--on); color: var(--fg); box-shadow: 0 1px 3px rgba(40, 30, 20, 0.14); }
    .switch { display: flex; align-items: center; gap: 10px; padding: 4px 0; color: var(--fg); }
    .switch i { width: 38px; height: 22px; border-radius: 999px; background: var(--track); position: relative; transition: background-color 0.2s ease; flex: none; }
    .switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(40, 30, 20, 0.3); transition: transform 0.2s var(--ease); }
    .switch[aria-pressed="true"] i { background: var(--accent); }
    .switch[aria-pressed="true"] i::after { transform: translateX(16px); }
    .pill {
      border: 1px solid var(--track); background: transparent; cursor: pointer; border-radius: 999px;
      padding: 6px 13px; font-size: 13px; font-weight: 550; color: var(--fg);
    }
    #title a { color: inherit; pointer-events: auto; text-underline-offset: 2px; }
    #views { display: flex; flex-wrap: wrap; gap: 6px; }
    #views button {
      border: 1px solid var(--track); background: transparent; cursor: pointer; white-space: nowrap;
      padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 550; color: var(--fg);
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    #views button[aria-pressed="true"] { background: var(--on); border-color: transparent; color: var(--accent); box-shadow: 0 1px 3px rgba(40, 30, 20, 0.14); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #error {
      position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); margin: 0 auto; max-width: 440px;
      padding: 16px 18px; border-radius: 16px; background: rgba(255, 255, 255, 0.94); box-shadow: var(--shadow);
      font-size: 14px; -webkit-user-select: text; user-select: text;
    }
    @media (max-width: 480px) {
      .tabs button { padding: 7px 8px; font-size: 12.5px; }
      .seg button, .switch { font-size: 12.5px; padding-left: 10px; padding-right: 10px; }
      .switch { padding-left: 0; padding-right: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01s !important; animation-duration: 0.01s !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <div id="loading"><span></span><p>Veistetään hirsiä ja kasvatetaan metsää…</p></div>

  <header id="title" class="glass">
    <h1>Hirsimökki<span id="badge"></span></h1>
    <p><span id="facts">12 × 8 m · sisäkorkeus 3 m</span> · <a href="hirsi.html">mallihirsi</a></p>
    <p id="meter" hidden></p>
  </header>

  <p id="hint">Vedä · nipistä · kaksoisnapauta tarkentaaksesi</p>

  <button id="menu" class="glass" type="button" aria-label="Säätimet" aria-expanded="false" aria-controls="sheet">
    <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
    </svg>
  </button>

  <section id="sheet" class="glass" aria-label="Säätimet">
    <div class="grip" aria-hidden="true"></div>
    <button id="sheetClose" type="button" aria-label="Sulje säätimet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="tabs" role="tablist" aria-label="Säätimet">
      <button type="button" role="tab" id="t-view" aria-controls="p-view" data-tab="view">Näkymä</button>
      <button type="button" role="tab" id="t-light" aria-controls="p-light" data-tab="light">Valo</button>
      <button type="button" role="tab" id="t-cabin" aria-controls="p-cabin" data-tab="cabin">Mökki</button>
      <button type="button" role="tab" id="t-deck" aria-controls="p-deck" data-tab="deck">Terassi</button>
      <button type="button" role="tab" id="t-place" aria-controls="p-place" data-tab="place">Paikka</button>
    </div>

    <div id="p-view" class="tabpanel" role="tabpanel" aria-labelledby="t-view">
      <nav id="views" aria-label="Näkymät"></nav>
      <label>Puut pois kameran ympäriltä <output id="clearOut"></output>
        <input id="clear" type="range" min="0" max="60" step="1" aria-label="Puiden piilotus kameran ympäriltä">
      </label>
      <p class="note">Piilotetut puut varjostavat yhä, joten kuva pysyy luonnollisena.</p>
    </div>

    <div id="p-light" class="tabpanel" role="tabpanel" aria-labelledby="t-light" hidden>
      <label>Valon suunta <output id="azOut"></output>
        <input id="az" type="range" min="0" max="360" step="1" aria-label="Valon suunta">
      </label>
      <label>Auringon korkeus <output id="elOut"></output>
        <input id="el" type="range" min="4" max="70" step="1" aria-label="Auringon korkeus">
      </label>
    </div>

    <div id="p-cabin" class="tabpanel" role="tabpanel" aria-labelledby="t-cabin" hidden>
      <label>Hirsien sävy <output id="toneOut"></output>
        <input id="tone" type="range" min="0" max="1" step="0.05" aria-label="Hirsien sävy">
      </label>
      <div class="row">
        <button id="roofOn" class="switch" type="button" aria-pressed="true">Katto <i></i></button>
        <div class="seg" role="group" aria-label="Katon tyyppi">
          <button type="button" data-roof="mono" aria-pressed="true">Pulpetti</button>
          <button type="button" data-roof="gable" aria-pressed="false">Harja</button>
        </div>
      </div>
      <label id="frontRow">Ylitys edessä <output id="frontOut"></output>
        <input id="front" type="range" min="0" max="3" step="0.05" aria-label="Katon ylitys edessä">
      </label>
      <label id="backRow">Ylitys takana <output id="backOut"></output>
        <input id="back" type="range" min="0" max="3" step="0.05" aria-label="Katon ylitys takana">
      </label>
      <label><span id="sideLabel">Ylitys sivuilla</span> <output id="sideOut"></output>
        <input id="side" type="range" min="0" max="1.5" step="0.05" aria-label="Katon ylitys sivuilla">
      </label>
    </div>

    <div id="p-deck" class="tabpanel" role="tabpanel" aria-labelledby="t-deck" hidden>
      <div class="row">
        <button id="deckOn" class="switch" type="button" aria-pressed="true">Terassi ja pergola <i></i></button>
        <div class="seg" role="group" aria-label="Pergolan pää">
          <button type="button" data-end="left" aria-pressed="true">Vasen</button>
          <button type="button" data-end="right" aria-pressed="false">Oikea</button>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Allas">
        <button type="button" data-tub="palju" aria-pressed="true">Palju</button>
        <button type="button" data-tub="spa" aria-pressed="false">Poreallas</button>
        <button type="button" data-tub="none" aria-pressed="false">Ei allasta</button>
      </div>
      <button id="glazing" class="switch" type="button" aria-pressed="true">Liukulasit kiinni <i></i></button>
    </div>

    <div id="p-place" class="tabpanel" role="tabpanel" aria-labelledby="t-place" hidden>
      <div class="row">
        <button id="moveOn" class="switch" type="button" aria-pressed="false">Siirrä napauttamalla maastoa <i></i></button>
        <button id="placeReset" class="pill" type="button">Palauta</button>
      </div>
      <p id="moveNote" class="note" hidden>Napauta maastoa paneelin yläpuolella: mökki siirtyy siihen ja maa muotoutuu sen alle.</p>
      <label>Mökin suunta <output id="yawOut"></output>
        <input id="yaw" type="range" min="-180" max="180" step="5" aria-label="Mökin suunta">
      </label>
    </div>
  </section>

  <p id="error" hidden></p>
  <script type="module" src="src/mokki.js"></script>
</body>
</html>
